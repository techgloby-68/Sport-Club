<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#141B2D"/>
    </linearGradient>

    <linearGradient id="runnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BCEB"/>
      <stop offset="50%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#FC4C02"/>
    </linearGradient>

    <linearGradient id="speedGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BCEB" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#CCFF00" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Dark Kinetic Tile Background -->
  <rect width="512" height="512" rx="128" fill="url(#tileBg)"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#00BCEB" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Cisco 9 Golden Gate Bridge Bars Emblem (Top subtle background) -->
  <g fill="#00BCEB" opacity="0.3">
    <rect x="180" y="70" width="12" height="28" rx="6"/>
    <rect x="204" y="52" width="12" height="46" rx="6"/>
    <rect x="228" y="70" width="12" height="28" rx="6"/>
    <rect x="252" y="34" width="12" height="64" rx="6" fill="#CCFF00"/>
    <rect x="276" y="70" width="12" height="28" rx="6"/>
    <rect x="300" y="52" width="12" height="46" rx="6"/>
    <rect x="324" y="70" width="12" height="28" rx="6"/>
  </g>

  <!-- Dynamic Running Athlete (Icon Chạy Bộ Tốc Độ) -->
  <g transform="translate(20, 20)">
    <!-- Athlete Head -->
    <circle cx="340" cy="130" r="36" fill="#CCFF00"/>

    <!-- Runner Torso & Arm Motion -->
    <path d="M 290 180 L 370 210 L 430 170 L 450 195 L 375 250 L 315 220 L 265 310 L 210 270 Z" fill="url(#runnerGrad)"/>

    <!-- Front Leg (Bent Forward Sprinting) -->
    <path d="M 265 310 L 360 360 L 330 450 L 290 440 L 315 375 L 240 335 Z" fill="#CCFF00"/>

    <!-- Back Leg (Kicking Backward High Power) -->
    <path d="M 240 280 L 150 340 L 80 320 L 90 285 L 145 300 L 215 255 Z" fill="#00BCEB"/>

    <!-- Kinetic Speed Trails (Dải Tốc Độ Thể Thao) -->
    <path d="M 50 200 L 180 200 L 160 225 L 50 225 Z" fill="#00BCEB"/>
    <path d="M 80 150 L 230 150 L 205 175 L 80 175 Z" fill="#CCFF00"/>
    <path d="M 30 250 L 140 250 L 120 275 L 30 275 Z" fill="#FC4C02"/>
  </g>
</svg>
